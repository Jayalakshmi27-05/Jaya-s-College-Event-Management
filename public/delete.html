
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Event - Jaya College</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Jaya's College Event Management</h1>
    <p>Plan • Organize • Celebrate</p>
</header>

<nav>
    <h2>Jaya Events</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="insert.html">Insert Event</a>
        <a href="list.html">List Events</a>
        <a href="listOne.html">Event Details</a>
        <a href="update.html">Update Event</a>
        <a href="delete.html">Delete Event</a>
    </div>
</nav>

<main class="container">
    <section class="card">
        <h2>Delete Event</h2>
        <p>Select an event and confirm before deleting it permanently.</p>

        <form id="deleteForm">
            <label for="eventId">Choose Event *</label>

            <select id="eventId" required>
                <option value="">Loading events...</option>
            </select>

            <button type="submit" id="deleteButton">
                Delete Event
            </button>

            <a class="btn secondary" href="list.html">
                View Events
            </a>
        </form>

        <p id="message" class="message" role="status"></p>
    </section>
</main>

<footer>
    © 2026 Jaya College Event Management
</footer>

<script>
const form = document.getElementById("deleteForm");
const select = document.getElementById("eventId");
const message = document.getElementById("message");
const deleteButton = document.getElementById("deleteButton");

async function loadEvents() {
    select.replaceChildren(new Option("Loading events...", ""));
    message.textContent = "";

    try {
        const response = await fetch("/api/events");
        const events = await response.json();

        if (!response.ok) {
            throw new Error(events.error || "Could not load events.");
        }

        select.replaceChildren(new Option("Select an event", ""));

        events.forEach(event => {
            select.add(
                new Option(
                    event.event_id + " - " + event.event_name,
                    event.event_id
                )
            );
        });

        if (events.length === 0) {
            message.textContent = "No events available to delete.";
        }
    } catch (error) {
        select.replaceChildren(new Option("Unable to load events", ""));
        message.textContent = error.message;
    }
}

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const id = select.value;

    if (!id) {
        message.textContent = "Please select an event.";
        return;
    }

    const confirmed = confirm(
        "Are you sure you want to delete this event?"
    );

    if (!confirmed) return;

    deleteButton.disabled = true;
    message.textContent = "Deleting event...";

    try {
        // Correct URL: matches the server.js DELETE route
        const response = await fetch(
            "/api/events/" + encodeURIComponent(id),
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "Failed to delete event."
            );
        }

        message.textContent = result.message;
        await loadEvents();

    } catch (error) {
        message.textContent = error.message;
        console.error("Delete error:", error);
    } finally {
        deleteButton.disabled = false;
    }
});

loadEvents();
</script>

</body>
</html>
