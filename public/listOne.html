```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Details - Jaya College</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Jaya's College Event Management</h1>
    <p>Plan • Organize • Celebrate</p>
</header>

<nav>
    <h2>Jaya Events</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="insert.html">Insert Event</a>
        <a href="list.html">List Events</a>
        <a href="listOne.html">Event Details</a>
        <a href="update.html">Update Event</a>
        <a href="delete.html">Delete Event</a>
    </div>
</nav>

<main class="container">

    <h2>Event Details</h2>
    <p>Select an event to view its complete information.</p>

    <form id="eventForm">

        <label for="eventId">Choose Event *</label>

        <select id="eventId" required>
            <option value="">Loading events...</option>
        </select>

        <button type="submit">View Details</button>

        <button type="button" class="secondary" id="reloadButton">
            Reload Events
        </button>

    </form>

    <p id="message" class="message" role="status"></p>

    <section id="details" aria-live="polite"></section>

</main>

<footer>
    © 2026 Jaya College Event Management
</footer>

<script>
const select = document.getElementById("eventId");
const details = document.getElementById("details");
const message = document.getElementById("message");
const form = document.getElementById("eventForm");
const reloadButton = document.getElementById("reloadButton");

function addDetail(container, label, value) {
    const p = document.createElement("p");
    const strong = document.createElement("strong");

    strong.textContent = label + ": ";
    p.appendChild(strong);

    p.appendChild(
        document.createTextNode(
            value === null || value === undefined || value === ""
                ? "Not provided"
                : String(value)
        )
    );

    container.appendChild(p);
}

async function loadOptions() {
    message.textContent = "Loading events...";
    details.replaceChildren();
    select.replaceChildren(new Option("Loading events...", ""));

    try {
        const response = await fetch("/api/events");

        if (!response.ok) {
            throw new Error("Unable to load events. HTTP " + response.status);
        }

        const events = await response.json();

        select.replaceChildren(new Option("Select an event", ""));

        events.forEach(event => {
            const id = event.event_id;

            const option = new Option(
                id + " - " + event.event_name,
                id
            );

            select.add(option);
        });

        if (events.length === 0) {
            message.textContent =
                "No events found. Please insert an event first.";
            return;
        }

        message.textContent = events.length + " event(s) loaded.";

        const params = new URLSearchParams(window.location.search);
        const requestedId = params.get("id");

        if (requestedId) {
            const exists = events.some(
                event => String(event.event_id) === requestedId
            );

            if (exists) {
                select.value = requestedId;
                await showEvent();
            } else {
                message.textContent =
                    "Event ID " + requestedId + " was not found.";
            }
        }

    } catch (error) {
        console.error("Load events error:", error);

        select.replaceChildren(new Option("Unable to load events", ""));
        message.textContent =
            "Error loading events: " + error.message;
    }
}

async function showEvent() {
    const id = select.value;

    details.replaceChildren();

    if (!id) {
        message.textContent = "Please select an event.";
        return;
    }

    message.textContent = "Loading event details...";

    try {
        const response = await fetch(
            "/api/events/" + encodeURIComponent(id)
        );

        const event = await response.json();

        if (!response.ok) {
            throw new Error(
                event.error || "Unable to retrieve event details."
            );
        }

        details.replaceChildren();

        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = event.event_name || "Event Details";
        card.appendChild(title);

        const image = document.createElement("img");
        image.className = "event-image";
        image.src =
            "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1000&q=80";
        image.alt = "College event celebration";
        image.loading = "lazy";

        card.appendChild(image);

        addDetail(card, "Event ID", event.event_id);
        addDetail(card, "Event Name", event.event_name);
        addDetail(card, "Event Type", event.event_type);
        addDetail(card, "Event Date", event.event_date);
        addDetail(card, "Venue", event.venue);
        addDetail(card, "Description", event.description);

        details.appendChild(card);

        message.textContent = "Event details loaded successfully.";

    } catch (error) {
        console.error("Event details error:", error);
        message.textContent =
            "Error loading event details: " + error.message;
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    await showEvent();
});

reloadButton.addEventListener("click", loadOptions);

loadOptions();
</script>

</body>
</html>
```
